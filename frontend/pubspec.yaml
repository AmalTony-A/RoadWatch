name: roadwatch_ai
description: AI-powered civic road safety and transparency platform
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  intl: ^0.20.1
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.11
  http_parser: ^4.0.2
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/complete_road_data.json
