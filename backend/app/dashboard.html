<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadWatch AI - Backend Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .header-subtitle {
            color: #666;
            font-size: 0.95em;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            border-bottom: 2px solid #eee;
        }
        
        .tab-button {
            padding: 12px 24px;
            background: none;
            border: none;
            font-size: 1em;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            color: #666;
        }
        
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-button:hover {
            color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-subtext {
            color: #999;
            font-size: 0.85em;
            margin-top: 8px;
        }
        
        .chart-container {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            position: relative;
            height: 400px;
        }
        
        .activity-log {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .activity-item {
            padding: 16px 24px;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 16px;
        }
        
        .activity-item:last-child {
            border-bottom: none;
        }
        
        .activity-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
        }
        
        .activity-type.complaint {
            background: #fef3cd;
            color: #856404;
        }
        
        .activity-type.detection {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .activity-type.prediction {
            background: #d4edda;
            color: #155724;
        }
        
        .activity-type.upload {
            background: #e7d4f5;
            color: #721c24;
        }
        
        .activity-type.system {
            background: #f8d7da;
            color: #721c24;
        }
        
        .activity-details {
            flex: 1;
        }
        
        .activity-desc {
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .activity-time {
            color: #999;
            font-size: 0.9em;
        }
        
        .refresh-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        
        .refresh-button:hover {
            background: #5568d3;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .info-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .info-box h3 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #666;
        }
        
        .info-value {
            font-weight: 600;
            color: #333;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛣️ RoadWatch AI - Backend Dashboard</h1>
            <p class="header-subtitle">Real-time system monitoring and activity tracking</p>
            
            <div class="tabs">
                <button class="tab-button active" onclick="switchTab('dashboard')">Dashboard</button>
                <button class="tab-button" onclick="switchTab('activity')">Activity Log</button>
                <button class="tab-button" onclick="switchTab('complaints')">Complaints</button>
                <button class="tab-button" onclick="switchTab('system')">System Info</button>
            </div>
        </header>
        
        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content active">
            <div class="controls">
                <button class="refresh-button" onclick="refreshDashboard()">🔄 Refresh</button>
                <span id="last-updated" style="color: white; align-self: center; margin-left: 20px;"></span>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Complaints</h3>
                    <div class="stat-value" id="total-complaints">0</div>
                </div>
                <div class="stat-card">
                    <h3>Filed / In Progress</h3>
                    <div class="stat-value" id="filed-complaints">0</div>
                </div>
                <div class="stat-card">
                    <h3>Sent to Authority</h3>
                    <div class="stat-value" id="sent-complaints">0</div>
                </div>
                <div class="stat-card">
                    <h3>Delivered</h3>
                    <div class="stat-value" id="delivered-complaints">0</div>
                </div>
                <div class="stat-card">
                    <h3>Read by Authority</h3>
                    <div class="stat-value" id="read-complaints">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Roads</h3>
                    <div class="stat-value" id="total-roads">0</div>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="complaints-chart"></canvas>
            </div>
            
            <div class="chart-container">
                <canvas id="activity-chart"></canvas>
            </div>
        </div>
        
        <!-- Activity Log Tab -->
        <div id="activity" class="tab-content">
            <div class="controls">
                <button class="refresh-button" onclick="refreshActivityLog()">🔄 Refresh</button>
                <button class="refresh-button" style="background: #dc3545;" onclick="clearActivityLog()">Clear Log</button>
            </div>
            <div id="activity-container" class="activity-log"></div>
        </div>
        
        <!-- Complaints Tab -->
        <div id="complaints" class="tab-content">
            <div class="controls">
                <button class="refresh-button" onclick="refreshComplaints()">🔄 Refresh</button>
            </div>
            <div id="complaints-container"></div>
        </div>
        
        <!-- System Info Tab -->
        <div id="system" class="tab-content">
            <div class="controls">
                <button class="refresh-button" onclick="refreshSystemInfo()">🔄 Refresh</button>
            </div>
            <div id="system-container"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        let chartsInitialized = false;
        let complaintsChart = null;
        let activityChart = null;
        
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            // Load data for the tab
            if (tabName === 'dashboard') {
                refreshDashboard();
            } else if (tabName === 'activity') {
                refreshActivityLog();
            } else if (tabName === 'complaints') {
                refreshComplaints();
            } else if (tabName === 'system') {
                refreshSystemInfo();
            }
        }
        
        function updateLastUpdated() {
            const now = new Date().toLocaleTimeString();
            document.getElementById('last-updated').textContent = `Last updated: ${now}`;
        }
        
        async function refreshDashboard() {
            try {
                updateLastUpdated();
                const statsRes = await fetch(`${API_BASE}/admin/dashboard-stats`);
                const stats = await statsRes.json();
                
                document.getElementById('total-complaints').textContent = stats.complaints.total;
                document.getElementById('filed-complaints').textContent = stats.complaints.filed;
                document.getElementById('sent-complaints').textContent = stats.complaints.sent;
                document.getElementById('delivered-complaints').textContent = stats.complaints.delivered;
                document.getElementById('read-complaints').textContent = stats.complaints.read;
                document.getElementById('total-roads').textContent = stats.data_counts.road_network_items;
                
                // Update complaints chart
                updateComplaintsChart(stats.complaints);
                
                // Update activity stats chart
                const activityStatsRes = await fetch(`${API_BASE}/admin/activity-stats`);
                const activityStats = await activityStatsRes.json();
                updateActivityChart(activityStats);
            } catch (error) {
                console.error('Error refreshing dashboard:', error);
            }
        }
        
        function updateComplaintsChart(data) {
            const ctx = document.getElementById('complaints-chart').getContext('2d');
            
            if (complaintsChart) {
                complaintsChart.destroy();
            }
            
            complaintsChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Filed', 'Sent', 'Delivered', 'Read'],
                    datasets: [{
                        data: [data.filed, data.sent, data.delivered, data.read],
                        backgroundColor: [
                            '#ffc107',
                            '#17a2b8',
                            '#28a745',
                            '#667eea'
                        ],
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        title: {
                            display: true,
                            text: 'Complaints Status Distribution'
                        }
                    }
                }
            });
        }
        
        function updateActivityChart(data) {
            const ctx = document.getElementById('activity-chart').getContext('2d');
            
            if (activityChart) {
                activityChart.destroy();
            }
            
            const types = Object.keys(data.by_type);
            const counts = Object.values(data.by_type);
            
            activityChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: types,
                    datasets: [{
                        label: 'Activity Count',
                        data: counts,
                        backgroundColor: '#667eea',
                        borderColor: '#5568d3',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: 'Activities by Type'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }
        
        async function refreshActivityLog() {
            try {
                updateLastUpdated();
                const res = await fetch(`${API_BASE}/admin/activity-log?limit=100`);
                const data = await res.json();
                
                const container = document.getElementById('activity-container');
                if (data.activities.length === 0) {
                    container.innerHTML = '<div style="padding: 40px; text-align: center; color: #999;">No activities logged yet</div>';
                    return;
                }
                
                container.innerHTML = data.activities.map(activity => `
                    <div class="activity-item">
                        <span class="activity-type ${activity.type.toLowerCase()}">${activity.type}</span>
                        <div class="activity-details">
                            <div class="activity-desc">${activity.description}</div>
                            <div class="activity-time">${new Date(activity.timestamp).toLocaleString()}</div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error refreshing activity log:', error);
            }
        }
        
        async function refreshComplaints() {
            try {
                updateLastUpdated();
                const res = await fetch(`${API_BASE}/admin/complaints-breakdown`);
                const data = await res.json();
                
                const container = document.getElementById('complaints-container');
                
                let html = '<div class="info-grid">';
                
                // Overall stats
                html += `
                    <div class="info-box">
                        <h3>Overall Statistics</h3>
                        <div class="info-item">
                            <span class="info-label">Total Complaints</span>
                            <span class="info-value">${data.total}</span>
                        </div>
                    </div>
                `;
                
                // By status
                if (Object.keys(data.by_status).length > 0) {
                    html += '<div class="info-box"><h3>By Status</h3>';
                    for (const [status, count] of Object.entries(data.by_status)) {
                        html += `
                            <div class="info-item">
                                <span class="info-label">${status}</span>
                                <span class="info-value">${count}</span>
                            </div>
                        `;
                    }
                    html += '</div>';
                }
                
                // By sent status
                html += `
                    <div class="info-box">
                        <h3>Sent to Authority</h3>
                        <div class="info-item">
                            <span class="info-label">Sent</span>
                            <span class="info-value">${data.by_sent_status.sent}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Not Sent</span>
                            <span class="info-value">${data.by_sent_status.not_sent}</span>
                        </div>
                    </div>
                `;
                
                // By delivery
                html += `
                    <div class="info-box">
                        <h3>Delivery Status</h3>
                        <div class="info-item">
                            <span class="info-label">Delivered</span>
                            <span class="info-value">${data.by_delivery.delivered}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Not Delivered</span>
                            <span class="info-value">${data.by_delivery.not_delivered}</span>
                        </div>
                    </div>
                `;
                
                // By read
                html += `
                    <div class="info-box">
                        <h3>Read Status</h3>
                        <div class="info-item">
                            <span class="info-label">Read by Authority</span>
                            <span class="info-value">${data.by_read.read}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Not Read</span>
                            <span class="info-value">${data.by_read.not_read}</span>
                        </div>
                    </div>
                `;
                
                html += '</div>';
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Error refreshing complaints:', error);
            }
        }
        
        async function refreshSystemInfo() {
            try {
                updateLastUpdated();
                const sysRes = await fetch(`${API_BASE}/admin/system-info`);
                const system = await sysRes.json();
                
                const roadRes = await fetch(`${API_BASE}/admin/road-network-stats`);
                const roads = await roadRes.json();
                
                const container = document.getElementById('system-container');
                
                let html = '<div class="info-grid">';
                
                html += `
                    <div class="info-box">
                        <h3>System Status</h3>
                        <div class="info-item">
                            <span class="info-label">Demo Mode</span>
                            <span class="info-value">${system.demo_mode ? 'ON' : 'OFF'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Database</span>
                            <span class="info-value">${system.database_type}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Connected</span>
                            <span class="info-value" style="color: ${system.database_connected ? '#28a745' : '#dc3545'};">
                                ${system.database_connected ? '✓ Yes' : '✗ No'}
                            </span>
                        </div>
                    </div>
                `;
                
                html += `
                    <div class="info-box">
                        <h3>Data Sources</h3>
                        <div class="info-item">
                            <span class="info-label">Roads</span>
                            <span class="info-value">${system.data_sources.roads}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Budgets</span>
                            <span class="info-value">${system.data_sources.budgets}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Road Network</span>
                            <span class="info-value">${system.data_sources.road_network}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Complaints</span>
                            <span class="info-value">${system.data_sources.complaints}</span>
                        </div>
                    </div>
                `;
                
                html += `
                    <div class="info-box">
                        <h3>Road Network Statistics</h3>
                        <div class="info-item">
                            <span class="info-label">Total Roads</span>
                            <span class="info-value">${roads.total_roads}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Total Length (km)</span>
                            <span class="info-value">${roads.total_length_km.toFixed(0)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Total Budget (Cr)</span>
                            <span class="info-value">₹${roads.total_budget_crore.toFixed(0)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Districts</span>
                            <span class="info-value">${roads.districts.length}</span>
                        </div>
                    </div>
                `;
                
                if (roads.districts.length > 0) {
                    html += `
                        <div class="info-box">
                            <h3>Districts Covered</h3>
                            ${roads.districts.map(d => `
                                <div class="info-item">
                                    <span class="info-label">📍 ${d}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
                
                html += '</div>';
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Error refreshing system info:', error);
            }
        }
        
        async function clearActivityLog() {
            if (!confirm('Are you sure you want to clear the activity log?')) {
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/admin/clear-activity-log`, {
                    method: 'POST'
                });
                
                if (res.ok) {
                    alert('Activity log cleared');
                    refreshActivityLog();
                }
            } catch (error) {
                console.error('Error clearing activity log:', error);
            }
        }
        
        // Initial load
        window.addEventListener('load', () => {
            refreshDashboard();
            setInterval(refreshDashboard, 30000); // Refresh every 30 seconds
        });
    </script>
</body>
</html>
